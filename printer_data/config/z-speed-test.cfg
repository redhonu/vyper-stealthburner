[gcode_macro TEST_Z_SPEED]
description: Supervised Z travel test between Z20 and Z120; SPEED in mm/s
gcode:
    {% set speed = params.SPEED|default(10)|float %}
    {% set cycles = params.CYCLES|default(1)|int %}
    {% set max_speed = printer.configfile.settings.printer.max_z_velocity|float %}
    {% if printer.print_stats.state in ['printing', 'paused'] or printer.pause_resume.is_paused %}
        {action_raise_error('Z speed test requires an idle printer with no paused print.')}
    {% elif 'xyz' not in printer.toolhead.homed_axes %}
        {action_raise_error('Home all axes before the Z speed test.')}
    {% elif speed <= 0 or speed > max_speed or speed > 10 %}
        {action_raise_error('Test speed must be positive and within the configured limit, up to 10 mm/s.')}
    {% elif cycles < 1 or cycles > 5 %}
        {action_raise_error('CYCLES must be between 1 and 5.')}
    {% elif printer.toolhead.axis_maximum.z < 130 %}
        {action_raise_error('Insufficient Z travel for this test.')}
    {% else %}
        SAVE_GCODE_STATE NAME=Z_SPEED_TEST
        G90
        G1 Z20 F300
        M400
        {% for _ in range(cycles) %}
            G1 Z120 F{speed * 60}
            M400
            G1 Z20 F{speed * 60}
            M400
        {% endfor %}
        RESTORE_GCODE_STATE NAME=Z_SPEED_TEST
    {% endif %}
